<style>
@page { size: A4; margin: 15mm 13mm 16mm 13mm; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  font-size: 10.5pt; line-height: 1.6; color: #1f2733; margin: 0;
}
/* 标题 */
h1 {
  font-size: 16.5pt; color: #16324f; margin: 24pt 0 11pt;
  padding-bottom: 4pt; border-bottom: 1.5px solid #2b6cb0;
  break-before: page; break-after: avoid;
}
h1:first-of-type { break-before: avoid; }
h2 { font-size: 13pt; color: #1e4e7e; margin: 16pt 0 7pt; break-after: avoid; }
h3 { font-size: 11pt; color: #2c5f8d; margin: 12pt 0 5pt; break-after: avoid; }
p { margin: 5pt 0; text-align: justify; }
/* 表格 */
table {
  border-collapse: collapse; width: 100%; margin: 9pt 0;
  font-size: 9.2pt; break-inside: auto;
}
th, td {
  border: 1px solid #9db2c6; padding: 4.5pt 6pt; text-align: left;
  vertical-align: top; word-break: break-word;
}
th { background: #e3edf7; color: #16324f; font-weight: 700; }
tbody tr:nth-child(even) { background: #f5f8fc; }
thead { display: table-header-group; }
/* 列表 / 引用 / 代码 */
ul, ol { margin: 5pt 0; padding-left: 20pt; }
li { margin: 2pt 0; }
blockquote {
  margin: 7pt 0; padding: 5pt 11pt; color: #5a6b7d;
  border-left: 3px solid #2b6cb0; background: #f4f8fd;
}
code {
  font-family: Consolas, "Courier New", monospace; font-size: 9pt;
  background: #eef2f6; padding: 1px 4px; border-radius: 3px;
}
pre { background: #f4f7fa; padding: 7pt; border: 1px solid #d5dee8; break-inside: avoid; }
pre code { background: none; padding: 0; }
/* 数学公式 */
.math.display { display: block; text-align: center; margin: 9pt 0; }
math { font-size: 10pt; }
/* 分隔线 */
hr { border: none; border-top: 1px solid #c7d3e0; margin: 12pt 0; }
a { color: #1e5fa8; text-decoration: none; }
/* 图片 */
img {
  display: block; margin: 8pt auto 4pt; max-width: 88%;
  height: auto; break-inside: avoid; page-break-inside: avoid;
  border: 1px solid #d8e0ea; border-radius: 4px; padding: 2px;
  background: #fff;
}
figure { margin: 8pt 0; break-inside: avoid; }
figcaption { text-align: center; font-size: 8.6pt; color: #5a6b7d; }
</style>
